// Top-level build file: only declares plugin versions; actual config lives in app/build.gradle
plugins {
    // Latest AGP 8.x; requires Gradle 8.13+. Kotlin 2.3.x supports AGP through 8.13.
    id 'com.android.application' version '8.13.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.3.10' apply false
}
